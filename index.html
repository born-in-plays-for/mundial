<!DOCTYPE html>

<meta charset="UTF-8">
<!-- #app-loading's own critical CSS, inlined here (not in an external stylesheet) and placed
     before any <link rel="stylesheet"> — deliberately, so the overlay is correctly styled and
     visible from the very first paint, never waiting on (or flashing unstyled before) an
     external CSS fetch. Colors are hardcoded to match --fixed-element-bg (css/global.css),
     rather than referencing that as a CSS custom property — the whole point is this block has
     zero external dependencies. See js/index.js's _hideAppLoading() for how/when this goes
     away: once the main data Promise.all().then() finishes (map rendered, legend built, sidebar
     populated) or, defensively, on any rejection in that chain — a stuck spinner forever would
     be a strictly worse failure mode than revealing a partially-broken page.
     Text (not a spinner): a rotating SVG spinner froze mid-rotation whenever the main thread
     was busy (JSON parsing, D3 render) — visibly stuck at an odd angle. The dots-reveal
     animation degrades much more gracefully under the same main-thread stalls: worst case it
     just pauses with N dots showing, which reads as "still going" rather than "broken". -->
<style>
  #app-loading {
    position: fixed; inset: 0; z-index: 999999;
    display: flex; align-items: center; justify-content: center;
    background: #faf9f6;
    transition: opacity .35s ease;
  }
  #app-loading.app-loading-hide { opacity: 0; pointer-events: none; }
  #app-loading .app-loading-text {
    font: 600 17px/1 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    color: #333;
  }
  #app-loading .app-loading-dots {
    display: inline-block;
    width: 4ch;
    overflow: hidden; /* "." advance isn't exactly 1ch in most fonts — without this, the
       ::before content can paint past the 4ch box and throw off left-alignment with
       .app-loading-log below, even though both boxes measure the same px. */
    vertical-align: bottom;
  }
  #app-loading .app-loading-dots::before {
    content: "....";
    display: inline-block;
    animation: app-loading-dots 1.4s steps(4) infinite;
  }
  @keyframes app-loading-dots {
    from { clip-path: inset(0 4ch 0 0); }
    to   { clip-path: inset(0 0 0 0); }
  }
  #app-loading .app-loading-inner {
    /* Fixed width, not shrink-to-fit: the log line's text changes constantly, and a
       shrink-wrapped box would resize (and get re-centered by the parent's
       justify-content:center) on every single update — a visible jump/flicker each time. */
    width: 320px;
    border: 1px dotted gray;
    padding: .5rem;
    background: rgb(253,253,253);
  }
  #app-loading .app-loading-log {
    margin-top: .5rem;
    font: 400 11px/1.2 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    color: #aaa;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
    /* Starts as a hidden placeholder (non-breaking space, not empty) so its line box
       reserves height from the very first paint — otherwise the first real _appLoadingLog()
       call would grow the box and shift .app-loading-text above it, a vertical flicker.
       js/index.js's _appLoadingLog() flips this to visible on first use. */
    visibility: hidden;
  }
</style>

<body>
<!-- Covers the whole viewport from first paint until js/index.js's _hideAppLoading() runs
     — replaces what used to be several independent things popping in at different times
     (placeholder sphere → real map, empty legend → gradient, the filter sidebar's own
     measure-then-collapse flash) with one deliberate loading→ready transition. -->
<div id="app-loading" role="status" aria-label="Loading">
  <div class="app-loading-inner">
    <div class="app-loading-text">Loading <span class="app-loading-dots" aria-hidden="true"></span></div>
    <div id="app-loading-log" class="app-loading-log" aria-hidden="true">&nbsp;</div>
  </div>
</div>
<!-- Plain (non-module) script — runs synchronously right here, before the parser even reaches
     the rest of this document, and well before js/index.js (a module script, deferred
     until parsing finishes) gets a chance to log its first fetch. An honest first line: this
     really is what the browser is doing at this exact point — parsing the HTML that follows. -->
<script>
  (function () {
    var el = document.getElementById('app-loading-log');
    if (el) { el.textContent = 'parsing HTML…'; el.style.visibility = 'visible'; }
    // document.readyState hits 'interactive' the instant parsing finishes — which is *before*
    // deferred/module scripts run (js/index.js is a module script, so it's deferred by
    // default). Under throttling, that module (plus everything it imports: i18n.js,
    // qualified.js, control_sidebar.js, elo_ranking.js, map-container.js…) still has to be
    // fetched and compiled before its own first log line can fire, so this message covers that
    // real gap instead of leaving "parsing HTML…" up looking stale. Whichever fires first —
    // js/index.js's own first _loggedFetch() or this — simply overwrites the other, so
    // there's no ordering to get wrong here.
    document.addEventListener('readystatechange', function onRSC() {
      if (document.readyState !== 'interactive') return;
      document.removeEventListener('readystatechange', onRSC);
      if (el) { el.textContent = 'HTML parsed, loading app scripts…'; el.style.visibility = 'visible'; }
    });
  })();
</script>

<main id="bottomTabContent" class="container-xxl px-4">
  <div id="tab-teams" class="taxonomy" role="tabpanel" tabindex="0" aria-labelledby="tab-teams-btn"></div>
  <div id="tab-players" role="tabpanel" tabindex="0" aria-labelledby="tab-players-btn"></div>
  <div id="tab-tournament" class="taxonomy" role="tabpanel" tabindex="0" aria-labelledby="tab-tournament-btn"></div>
</main>

<footer id="bottom-panel" class="container-xxl">
  <button id="scroll-top-btn" aria-label="Scroll to top"><svg viewBox="-4 -4 18 15" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M1 6L5 2L9 6"/></svg></button>
  <div id="selection-panel" class="tab-footer-panel collapsed d-flex justify-content-evenly nav nav-tabs"></div>
  <nav id="bottomTabList" class="pb-1 px-3 d-flex justify-content-between gap-4 nav-tabs" role="tablist">
    <!-- Dotted line, js/index.js's _updateTabConnector — points from whichever of
         #tab-teams-btn/#tab-tournament-btn is the current _activeTab (the data source behind
         #tab-players-btn's own "N countries" count) to #tab-players-btn itself, so that count
         has a visible, persistent reference back to where it came from even after switching to
         #tab-players (where _activeTab, deliberately, does NOT change — see that var's comment).
         position:absolute takes it out of this nav's flex layout entirely, so it doesn't disturb
         the 3-button justify-content-between spacing. -->
    <div id="tab-connector" aria-hidden="true"></div>
    <div  class="nav-item">
      <button class="nav-link" id="tab-teams-btn" data-tab="tab-teams" type="button" role="tab" data-bs-toggle="tab" data-bs-target="#tab-teams" aria-controls="tab-teams" aria-selected="false"><img class="tab-icon" src="images/solar_linear/flag-svgrepo-com.svg" aria-hidden="true"></button>
    </div>
    <div class="nav-item">
      <!-- No data-bs-toggle="tab" here, deliberately — Bootstrap registers its tab click-to-show
           listener on document with useCapture:true (see its EventHandler.on delegation code),
           so it fires *before* any stopPropagation() called by a descendant's own bubble-phase
           click handler. #tab-players-btn nests a close (✕) button (js/index.js's
           _tabPlayersLabel) whose click must NOT switch tabs, and capture-phase delegation makes
           that unstoppable from here. This button's own "switch to me" click is instead wired
           explicitly via _tabPlayersLabel's own @click (_switchTab/_showAllPlayers), so Bootstrap's
           auto-delegation isn't needed — data-bs-target/role="tab" stay, since Tab.show() (called
           programmatically via _switchTab) still needs them to find/activate the #tab-players pane
           and to recognize this button as part of the tab group (_getActiveElem/_getChildren). -->
      <button class="nav-link" id="tab-players-btn" data-tab="tab-players" type="button" role="tab" data-bs-target="#tab-players" aria-controls="tab-players" aria-selected="false"></button>
    </div>
    <div  class="nav-item">
      <button class="nav-link" id="tab-tournament-btn" data-tab="tab-tournament" type="button" role="tab" data-bs-toggle="tab" data-bs-target="#tab-tournament" aria-controls="tab-tournament" aria-selected="false"><img class="tab-icon" src="images/world-cup-svgrepo-com.svg" aria-hidden="true"></button>
    </div>
  </nav>
</footer>
